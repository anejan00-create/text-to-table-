
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تبدیل متن به جدول</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.8;
      background: #f5f7fa;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      margin: 12px 0;
      padding: 10px 18px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 8px;
      text-align: right;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>تبدیل متن به جدول</h1>
  <p>هر سطر را وارد کنید و بخش‌های آن را با ویرگول جدا کنید.</p>

  <textarea id="input" placeholder="مثال:
نام،سن،شهر
علی،25،تهران
سارا،30،شیراز"></textarea>

  <button onclick="convertText()">تبدیل به جدول</button>
  <button onclick="downloadCSV()">دانلود جدول</button>

  <div id="output"></div>

  <script>
    let rows = [];

    function convertText() {
      const text = document.getElementById("input").value.trim();
      const output = document.getElementById("output");

      if (!text) {
        output.textContent = "لطفاً ابتدا متنی وارد کنید.";
        rows = [];
        return;
      }

      const lines = text.split(/\r?\n/).filter(line => line.trim());

if (lines.some(line => line.trim().includes("|"))) {
  rows = lines
    .filter(line => !/^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim()))
    .map(line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim()));
} else {
  rows = lines.map(line => line.split(/[,،]/).map(cell => cell.trim()));
}
      const table = document.createElement("table");

      rows.forEach((row, index) => {
        const tr = document.createElement("tr");

        row.forEach(cell => {
          const td = document.createElement(index === 0 ? "th" : "td");
          td.textContent = cell.trim();
          tr.appendChild(td);
        });

        table.appendChild(tr);
      });

      output.replaceChildren(table);
    }

    function downloadCSV() {
      if (!rows.length) {
        alert("ابتدا متن را به جدول تبدیل کنید.");
        return;
      }

      const csv = "\uFEFF" + rows.map(row =>
        row.map(cell => '"' + cell.replace(/"/g, '""') + '"').join(",")
      ).join("\r\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "table.csv";
      link.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
